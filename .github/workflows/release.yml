name: release

on:
  push:
    branches:
      - main
    paths:
      - service/vendir.yml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Carvel tools
        run: curl -L https://carvel.dev/install.sh | sudo bash

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream chart
        run: make sync

      - name: Release package
        run: make release

      - name: Get version
        id: version
        run: echo "version=$(make -s version)" >> $GITHUB_OUTPUT

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add service/vendir.lock.yml service/carvel-artifacts/ argo-workflows-service.yml
          git diff --staged --quiet && echo "no changes to commit" && exit 0
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Tag release
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: argo-workflows-service.yml
          generate_release_notes: true
