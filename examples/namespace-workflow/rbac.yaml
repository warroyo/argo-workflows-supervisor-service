# Service account that workflow executor pods run as.
# Name matches workflow.serviceAccount.name chart default ("argo-workflow").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
---
# Minimum permissions for the workflow executor to report step results back to the controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-executor
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflowtaskresults
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-executor
subjects:
- kind: ServiceAccount
  name: argo-workflow
